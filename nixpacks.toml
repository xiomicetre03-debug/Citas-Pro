# deploy v2
[phases.setup]
nixPkgs = ["php83","php83Extensions.sqlite3","php83Extensions.pdo","php83Extensions.pdo_sqlite","php83Extensions.mbstring","php83Extensions.xml","php83Extensions.curl","php83Extensions.zip","php83Extensions.gd","php83Extensions.fileinfo","php83Extensions.tokenizer","php83Extensions.openssl","composer"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
