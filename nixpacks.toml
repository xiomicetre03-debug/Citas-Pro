[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.sqlite3",
  "php83Extensions.pdo",
  "php83Extensions.pdo_sqlite",
  "php83Extensions.mbstring",
  "php83Extensions.xml",
  "php83Extensions.curl",
  "php83Extensions.zip",
  "php83Extensions.gd",
  "php83Extensions.fileinfo",
  "php83Extensions.tokenizer",
  "php83Extensions.openssl",
  "composer"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction"
]

[phases.build]
cmds = [
  "mkdir -p database",
  "touch database/database.sqlite",
  "mkdir -p storage/framework/sessions",
  "mkdir -p storage/framework/views",
  "mkdir -p storage/framework/cache/data",
  "mkdir -p storage/logs",
  "chmod -R 775 storage bootstrap/cache"
]

[start]
cmd = "php artisan migrate:fresh --force && php artisan storage:link --force || true && php artisan serve --host=0.0.0.0 --port=$PORT"
